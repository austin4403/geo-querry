syntax = "proto3";

package geoquerry.v1;

option go_package = "gitlab.com/austin4403/geoquerry/backend/pkg/proto/geoquerryv1";

message StreamLiveTelemetryRequest {
  string user_id = 1;
  string user_name = 2;
  int64 project_id = 3;
  double latitude = 4;
  double longitude = 5;
  double elevation = 6;
  double gps_accuracy = 7;
  double heading = 8;
  double speed_mps = 9;
  int32 battery_percentage = 10;
  int64 recorded_at = 11;
}

message TeamMemberLocation {
  string user_id = 1;
  string user_name = 2;
  double latitude = 3;
  double longitude = 4;
  double elevation = 5;
  double heading = 6;
  int32 battery_percentage = 7;
  int64 last_seen_at = 8;
  bool is_active = 9;
}

message StreamLiveTelemetryResponse {
  int64 project_id = 1;
  repeated TeamMemberLocation members = 2;
}
