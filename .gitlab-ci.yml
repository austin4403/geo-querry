# =============================================================================
# GeoQuerry CI/CD — test, scan, build, deploy
# =============================================================================
# Security gates mirror SECURITY.md: govulncheck fails on reachable CVEs,
# gosec fails on new findings in hand-written code. A regression is caught
# at merge time, not in production.

# GitLab's built-in SAST (semgrep) + secret detection run alongside our own
# scanners — defense in depth, zero config.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - security
  - build
  - deploy

variables:
  # Alpine for cgo-free jobs (vet, scanners): small and fast. Pinned to Go 1.26.
  GO_IMAGE: golang:1.26-alpine
  # Debian for the test job: -race REQUIRES cgo (a C compiler), which the
  # alpine image does not ship — "go: -race requires cgo" failure. The
  # debian golang image has gcc and CGO enabled by default.
  GO_TEST_IMAGE: golang:1.26
  # Pinned Node.js LTS image for Next.js web application
  NODE_IMAGE: node:22-alpine
  # "auto" lets the go command fetch the toolchain the module declares (go1.26.8)
  GOTOOLCHAIN: auto
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA

# --- Test: Go Backend --------------------------------------------------------
test_backend:
  stage: test
  image: $GO_TEST_IMAGE
  script:
    - cd backend
    - go vet ./...
    - go test -race -count=1 ./...

# --- Test: Next.js Web Quality Gate ------------------------------------------
# Frozen lockfile install, strict lint, typecheck, vitest assertions, and production build
web_quality:
  stage: test
  image: $NODE_IMAGE
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    NODE_ENV: test
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  before_script:
    - cd web
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - web/.next/

# --- Security ----------------------------------------------------------------
# govulncheck: official Go vulnerability database, CALL-GRAPH aware — it
# only fails when a known CVE is actually reachable from our code, so a
# transitive dependency with an irrelevant advisory doesn't block the pipe.
# Pinned to v1.8.0 with toolchain go1.26.8 to resolve standard library CVEs.
govulncheck:
  stage: security
  image: $GO_IMAGE
  script:
    - cd backend
    - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  allow_failure: false

# gosec: static security analysis (CWE rules) pinned to v2.22.1. pkg/proto is GENERATED code
# (protobuf codegen's standard unsafe usage) — excluded, see SECURITY.md §6.8.
gosec:
  stage: security
  image: $GO_IMAGE
  script:
    - cd backend
    - go run github.com/securego/gosec/v2/cmd/gosec@v2.22.1 -quiet -exclude-dir=pkg/proto ./...

# --- Build -------------------------------------------------------------------
# Multi-stage Dockerfile -> scratch image (~15 MB). Build context is the
# repo root because the Dockerfile lives in backend/ but copies backend/.
build_docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Two tags per build: the immutable <sha> for versioning/rollback, and
    # mutable :latest which the Koyeb service points at — a redeploy then
    # always picks up the freshest main build.
    - docker build -t "$DOCKER_IMAGE" -t "$CI_REGISTRY_IMAGE/api:latest" -f backend/Dockerfile .
    - docker push "$DOCKER_IMAGE"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"
  only:
    - main

# --- Deploy ------------------------------------------------------------------
# Koyeb redeploy: POST /v1/services/{id}/redeploy is Koyeb's documented
# control-plane action (used by their own registry-webhook integrations).
# The Koyeb service must reference <registry>/api:latest so the redeploy
# re-pulls the image this pipeline just pushed. Env vars (DATABASE_URL,
# GEOQUERRY_API_KEYS, CORS_ALLOWED_ORIGINS) live in Koyeb's service config
# — see SECURITY.md §7.
#
# The job SKIPS ITSELF (rules) until both KOYEB_API_TOKEN and
# KOYEB_SERVICE_ID are set as masked+protected CI variables — an unconfigured
# deploy target must not turn the whole pipeline red.
deploy_koyeb:
  stage: deploy
  image: curlimages/curl:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $KOYEB_API_TOKEN && $KOYEB_SERVICE_ID'
  script:
    # -sS: quiet but NOT silent — errors and the response body stay visible
    # in the job log (the old -sf swallowed the API's error message).
    - >
      curl -sS -X POST
      "https://app.koyeb.com/v1/services/${KOYEB_SERVICE_ID}/redeploy"
      -H "Authorization: Bearer ${KOYEB_API_TOKEN}"
      -H "Content-Type: application/json"
      -d '{}'
    - echo "Koyeb redeploy triggered for service ${KOYEB_SERVICE_ID}"
