syntax = "proto3";

package geoquerry.v1;

option go_package = "gitlab.com/austin4403/geoquerry/backend/pkg/proto/geoquerry/v1;geoquerryv1";

message StructuralMeasurement {
  string id = 1;
  string station_id = 2;
  string measurement_type = 3;
  double strike = 4;
  double dip = 5;
  double dip_direction = 6;
  bool autocaptured = 7;
  double trend = 8;
  double plunge = 9;
  string notes = 10;
  int64 updated_at = 11;
  bool is_deleted = 12;
}

message RockSample {
  string id = 1;
  string station_id = 2;
  string sample_tag = 3;
  string lithology_class = 4;
  string mineralization_notes = 5;
  repeated string photo_r2_keys = 6;
  string assays_status = 7;
  int64 updated_at = 8;
  bool is_deleted = 9;
}

message Station {
  string id = 1;
  string project_id = 2;
  string code = 3;
  string name = 4;
  double latitude = 5;
  double longitude = 6;
  double elevation = 7;
  double gps_accuracy = 8;
  string outcrop_exposure = 9;
  string lithology = 10;
  string notes = 11;
  repeated StructuralMeasurement measurements = 12; //populated by server on pull but ignored on push
  repeated RockSample samples = 13; // this too and the one below
  repeated Vegetation vegetation = 14;
  int64 updated_at = 15;
  bool is_deleted = 16;
}

message BoreholeInterval {
  string id = 1;
  string borehole_id = 2;
  double depth_from = 3;
  double depth_to = 4;
  string lithology = 5;
  string description = 6;
  double recovery_percentage = 7;
}
message Borehole {
  string id = 1;
  string project_id = 2;
  string borehole_code = 3;
  string name = 4;
  double latitude = 5;
  double longitude = 6;
  double collar_elevation = 7;
  double total_depth_meters = 8;
  double water_strike_depth = 9;
  double yield_liters_per_hour = 10;
  repeated BoreholeInterval intervals = 11;
  int64 updated_at = 12;
  bool is_deleted = 13;
}

// This is like a license boundary and some polygons that will be made and sync
message ConcessionPolygon {
  string id = 1;
  string project_id = 2;
  string code = 3; // e.g "ML-2020-01 "
  string name = 4; // "kitui south"
  string license_type = 5;
  string geojson_geometry = 6;
  string status = 7;
  int64 valid_until = 8;
  int64 updated_at = 9;
}

// this is for the added vegetation data for use in field mapping

message Vegetation {
  string id = 1;
  string station_id = 2;
  string description = 3;
  repeated string photo_r2_keys = 4;
  int64 updated_at = 5;
  bool is_deleted = 6;
}
