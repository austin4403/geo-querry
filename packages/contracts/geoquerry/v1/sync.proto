syntax = "proto3";

package geoquerry.v1;

import "geoquerry/v1/geology.proto";

option go_package = "gitlab.com/austin4403/geoquerry/backend/pkg/proto/geoquerry/v1;geoquerryv1";

enum SyncStatus {
    SYNC_STATUS_UNSPECIFIED = 0;
    SYNC_STATUS_SYNCED = 1;
    SYNC_STATUS_CONFLICT_OVERWROTE = 2;
    SYNC_STATUS_CONFLICT_STALE = 3;
    SYNC_STATUS_REJECTED = 4;
}

message PushSyncQueueRequest {
  string project_id = 1;
  string client_device_id = 2;
  repeated Station stations = 3;
  repeated StructuralMeasurement measurements = 4;
  repeated RockSample samples = 5;
  repeated Borehole boreholes = 6;
  repeated Vegetation vegetation = 7;
  int64 client_timestamp = 8;
}

message EntitySyncResult {
  string id = 1;
  SyncStatus status = 2;
  string error_message = 3;
}

message PushSyncQueueResponse {
  bool success = 1;
  int64 server_timestamp = 2;
  repeated EntitySyncResult station_results = 3;
  repeated EntitySyncResult measurements_results = 4;
  repeated EntitySyncResult samples_results = 5;
  repeated EntitySyncResult vegetation_results = 6;
  repeated EntitySyncResult boreholes_results = 7;
}

message PullProjectDataRequest {
  string project_id = 1;
  int64 since_timestamp = 2; // when last was the sync done
}

message PullProjectDataResponse {
  int64 server_timestamp = 1;
  repeated Station stations = 2;
  repeated StructuralMeasurement measurements = 3;
  repeated RockSample samples = 4;
  repeated Borehole boreholes = 5;
  repeated Vegetation vegetation = 6;
  repeated ConcessionPolygon concessions = 7;
}
